<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Premium food, grooming, play and comfort for dogs, cats, birds and small pets." />
    <meta name="theme-color" content="#F4F6F3" />
    <title>Pawvana — premium pet care</title>
    <script>
      // Apply the saved (or system) theme before first paint so there is no flash.
      (function () {
        try {
          var t = localStorage.getItem('pawvana:theme');
          if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', t);
          document.querySelector('meta[name=theme-color]').setAttribute('content', t === 'dark' ? '#07191A' : '#F4F6F3');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
